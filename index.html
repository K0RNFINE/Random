<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Axis — B · V · F</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07080d;
      --grid: rgba(255,255,255,0.04);
      --axis-b: #00f5d4;
      --axis-v: #f72585;
      --axis-f: #ffe066;
      --text: #e8eaf0;
      --dim: rgba(232,234,240,0.35);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1rem, 3vw, 1.4rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text);
      opacity: 0.85;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--dim);
      margin-bottom: 16px;
    }

    canvas {
      display: block;
      cursor: grab;
      border-radius: 4px;
    }
    canvas:active { cursor: grabbing; }

    /* ── charge toggle ── */
    .charge-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }
    .charge-label {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--dim);
    }
    .toggle-wrap {
      display: flex;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      overflow: hidden;
    }
    .toggle-btn {
      padding: 5px 18px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--dim);
      transition: background 0.2s, color 0.2s;
    }
    .toggle-btn.active-pos {
      background: rgba(0,245,212,0.18);
      color: var(--axis-b);
    }
    .toggle-btn.active-neg {
      background: rgba(247,37,133,0.18);
      color: var(--axis-v);
    }

    .legend {
      display: flex;
      gap: 22px;
      margin-top: 14px;
      font-size: 0.72rem;
      letter-spacing: 0.11em;
    }
    .legend-item { display: flex; align-items: center; gap: 7px; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    .hint {
      margin-top: 10px;
      font-size: 0.62rem;
      color: var(--dim);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <h1>3D Axis Reference</h1>
  <p class="subtitle">drag / touch to rotate freely</p>

  <canvas id="c"></canvas>

  <div class="charge-row">
    <span class="charge-label">CHARGE:</span>
    <div class="toggle-wrap">
      <button class="toggle-btn" id="btn-pos">＋</button>
      <button class="toggle-btn active-neg" id="btn-neg">－</button>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--axis-b)"></div>
      <span style="color:var(--axis-b)">B</span>&nbsp;<span style="color:var(--dim)">Front/Back</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--axis-v)"></div>
      <span style="color:var(--axis-v)">V</span>&nbsp;<span style="color:var(--dim)">Left/Right</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--axis-f)"></div>
      <span style="color:var(--axis-f)">F</span>&nbsp;<span style="color:var(--dim)">Up/Down</span>
    </div>
  </div>
  <p class="hint">B = X &nbsp;·&nbsp; V = Y &nbsp;·&nbsp; F = Z &nbsp;·&nbsp; + charge inverts F</p>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');

  // ── charge state ──────────────────────────────────────────────────────────
  let chargePos = false; // false = negative (default), true = positive

  document.getElementById('btn-pos').addEventListener('click', () => {
    chargePos = true;
    document.getElementById('btn-pos').className = 'toggle-btn active-pos';
    document.getElementById('btn-neg').className = 'toggle-btn';
    draw();
  });
  document.getElementById('btn-neg').addEventListener('click', () => {
    chargePos = false;
    document.getElementById('btn-neg').className = 'toggle-btn active-neg';
    document.getElementById('btn-pos').className = 'toggle-btn';
    draw();
  });

  // ── sizing ────────────────────────────────────────────────────────────────
  function resize() {
    const size = Math.min(window.innerWidth * 0.92, window.innerHeight * 0.48, 500);
    canvas.width  = size;
    canvas.height = size;
  }
  resize();
  window.addEventListener('resize', () => { resize(); draw(); });

  // ── trackball rotation (quaternion-based, full 3-DOF) ─────────────────────
  // Stores orientation as a 4-element quaternion [w, x, y, z]
  let quat = [1, 0, 0, 0];

  function qMul([w1,x1,y1,z1], [w2,x2,y2,z2]) {
    return [
      w1*w2 - x1*x2 - y1*y2 - z1*z2,
      w1*x2 + x1*w2 + y1*z2 - z1*y2,
      w1*y2 - x1*z2 + y1*w2 + z1*x2,
      w1*z2 + x1*y2 - y1*x2 + z1*w2,
    ];
  }

  function qNorm([w,x,y,z]) {
    const l = Math.sqrt(w*w+x*x+y*y+z*z) || 1;
    return [w/l, x/l, y/l, z/l];
  }

  // rotate 3D point by quaternion
  function qRotate([w,x,y,z], [px,py,pz]) {
    // p' = q * p * q^-1
    const qc = [w,-x,-y,-z];
    const pq = [0, px, py, pz];
    const [,rx,ry,rz] = qMul(qMul([w,x,y,z], pq), qc);
    return [rx, ry, rz];
  }

  // Build a rotation quaternion from axis (ax,ay,az) and angle
  function axisAngleQuat(ax, ay, az, angle) {
    const s = Math.sin(angle / 2);
    return [Math.cos(angle / 2), ax*s, ay*s, az*s];
  }

  // Convert canvas drag delta to trackball rotation
  // dx = horizontal drag → rotate around world Y (screen up axis)
  // dy = vertical drag   → rotate around world X (screen right axis)
  function applyDrag(dx, dy) {
    const size  = canvas.width;
    const speed = 2.5 / size;
    const angleX = dy * speed;  // tilt up/down
    const angleY = dx * speed;  // spin left/right

    // World-space axes for screen horizontal/vertical
    const qY = axisAngleQuat(0, 1, 0, angleY); // spin around world Y
    const qX = axisAngleQuat(1, 0, 0, angleX); // tilt around world X
    quat = qNorm(qMul(qMul(qY, qX), quat));
  }

  // ── drag (mouse) ──────────────────────────────────────────────────────────
  let dragging = false, lastX = 0, lastY = 0;

  canvas.addEventListener('mousedown', e => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    resetIdle();
  });
  window.addEventListener('mouseup', () => dragging = false);
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    applyDrag(e.clientX - lastX, e.clientY - lastY);
    lastX = e.clientX; lastY = e.clientY;
    draw();
  });

  // ── drag (touch) ──────────────────────────────────────────────────────────
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    dragging = true; lastX = t.clientX; lastY = t.clientY;
    resetIdle();
  }, { passive: false });
  window.addEventListener('touchend', () => dragging = false);
  window.addEventListener('touchmove', e => {
    if (!dragging) return;
    e.preventDefault();
    const t = e.touches[0];
    applyDrag(t.clientX - lastX, t.clientY - lastY);
    lastX = t.clientX; lastY = t.clientY;
    draw();
  }, { passive: false });

  // ── auto-spin ─────────────────────────────────────────────────────────────
  let idleTimer = null, spinning = false;
  function resetIdle() {
    spinning = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { spinning = true; spin(); }, 3000);
  }
  function spin() {
    if (!spinning) return;
    applyDrag(1.2, 0);
    draw();
    requestAnimationFrame(spin);
  }
  resetIdle();

  // ── project 3D → 2D ───────────────────────────────────────────────────────
  function transform(p3) {
    const [rx, ry, rz] = qRotate(quat, p3);
    const fov   = 3.8;
    const s     = canvas.width / 2;
    const scale = s * fov / (fov + rz + 2);
    return [s + rx * scale, s + ry * scale, rz];
  }

  // ── colours ───────────────────────────────────────────────────────────────
  const COLORS = { B:'#00f5d4', V:'#f72585', F:'#ffe066' };

  // ── draw helpers ──────────────────────────────────────────────────────────
  function line(a, b, color, dash=[]) {
    const [ax,ay] = transform(a), [bx,by] = transform(b);
    ctx.save();
    ctx.beginPath(); ctx.setLineDash(dash);
    ctx.strokeStyle = color; ctx.lineWidth = 2.2;
    ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    ctx.restore();
  }

  function arrow(from, to, color) {
    const [fx,fy] = transform(from), [tx,ty] = transform(to);
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.6;
    ctx.shadowColor = color; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(tx,ty); ctx.stroke();
    const a = Math.atan2(ty-fy, tx-fx), hl = 16;
    ctx.beginPath();
    ctx.moveTo(tx,ty);
    ctx.lineTo(tx - hl*Math.cos(a-0.38), ty - hl*Math.sin(a-0.38));
    ctx.lineTo(tx - hl*Math.cos(a+0.38), ty - hl*Math.sin(a+0.38));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function label(pos, text, color) {
    const [px,py] = transform(pos);
    const size = canvas.width * 0.065;
    ctx.save();
    ctx.font = `900 ${size}px 'Orbitron', sans-serif`;
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = color; ctx.shadowBlur = 20;
    ctx.fillText(text, px, py);
    ctx.restore();
  }

  function smallLabel(pos, text, color) {
    const [px,py] = transform(pos);
    const size = canvas.width * 0.030;
    ctx.save();
    ctx.font = `700 ${size}px 'Share Tech Mono', monospace`;
    ctx.fillStyle = color + '99'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = color; ctx.shadowBlur = 6;
    ctx.fillText(text, px, py);
    ctx.restore();
  }

  function dot(pos, color, r=5) {
    const [px,py] = transform(pos);
    ctx.save();
    ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2);
    ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 12;
    ctx.fill(); ctx.restore();
  }

  // ── main draw ─────────────────────────────────────────────────────────────
  const L = 0.9, LA = 1.05;

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // F sign: +charge inverts F axis
    const Fs = chargePos ? -1 : 1;  // 1 = normal, -1 = inverted

    // origin glow
    const [ox,oy] = transform([0,0,0]);
    const g = ctx.createRadialGradient(ox,oy,0,ox,oy,canvas.width*0.18);
    g.addColorStop(0,'rgba(255,255,255,0.06)'); g.addColorStop(1,'transparent');
    ctx.fillStyle = g; ctx.fillRect(0,0,canvas.width,canvas.height);

    // grid on B–V plane (z=0)
    const N=4, step=0.25;
    for (let i=-N; i<=N; i++) {
      const t = i*step;
      line([-1,t,0],[1,t,0],'rgba(255,255,255,0.07)');
      line([t,-1,0],[t,1,0],'rgba(255,255,255,0.07)');
    }

    // dashed negative halves
    line([0,0,0],[-L,0,0], COLORS.B+'55',[6,5]);
    line([0,0,0],[0,-L,0], COLORS.V+'55',[6,5]);
    line([0,0,0],[0,0,-L*Fs], COLORS.F+'55',[6,5]);

    // positive axes
    arrow([0,0,0],[LA,0,0],   COLORS.B);
    arrow([0,0,0],[0,LA,0],   COLORS.V);
    arrow([0,0,0],[0,0,LA*Fs],COLORS.F);

    // axis labels
    label([LA+0.18, 0,       0      ], 'B', COLORS.B);
    label([0,       LA+0.18, 0      ], 'V', COLORS.V);
    label([0,       0,       (LA+0.18)*Fs], 'F', COLORS.F);

    // negative labels
    smallLabel([-L-0.15, 0,       0       ], '-B', COLORS.B);
    smallLabel([0,       -L-0.15, 0       ], '-V', COLORS.V);
    smallLabel([0,       0,       -(L+0.15)*Fs], '-F', COLORS.F);

    // origin dot
    dot([0,0,0],'#ffffff',5);

    // ── −B plane: 5×5 arrow grid pointing toward +B ──────────────────────────
    const PLANE_X  = -L;
    const GRID_N   = 2;
    const GRID_STEP = 0.38;

    // Shared screen-space direction: plane-centre → +B tip
    const [bpx,bpy] = transform([LA,0,0]);
    const [bnx,bny] = transform([PLANE_X,0,0]);
    const ddx=bpx-bnx, ddy=bpy-bny;
    const dlen=Math.sqrt(ddx*ddx+ddy*ddy)||1;
    const ndx=ddx/dlen, ndy=ddy/dlen;

    const ARL  = canvas.width*0.038;
    const AHL  = canvas.width*0.013;
    const aAng = Math.atan2(ndy,ndx);
    const aSpr = 0.44;

    for (let vi=-GRID_N; vi<=GRID_N; vi++) {
      for (let fi=-GRID_N; fi<=GRID_N; fi++) {
        const [px,py] = transform([PLANE_X, vi*GRID_STEP, fi*GRID_STEP]);
        const dist = Math.sqrt((vi/GRID_N)**2+(fi/GRID_N)**2);
        const alpha = Math.max(0.18, 1-dist*0.52);

        const tx=px+ndx*ARL, ty=py+ndy*ARL;
        const tlx=px-ndx*ARL*0.65, tly=py-ndy*ARL*0.65;

        ctx.save();
        ctx.globalAlpha=alpha;
        ctx.strokeStyle=COLORS.B; ctx.fillStyle=COLORS.B;
        ctx.lineWidth=1.8; ctx.shadowColor=COLORS.B; ctx.shadowBlur=10;
        ctx.beginPath(); ctx.moveTo(tlx,tly); ctx.lineTo(tx,ty); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(tx,ty);
        ctx.lineTo(tx-AHL*Math.cos(aAng-aSpr), ty-AHL*Math.sin(aAng-aSpr));
        ctx.lineTo(tx-AHL*Math.cos(aAng+aSpr), ty-AHL*Math.sin(aAng+aSpr));
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    // dashed border of -B plane
    const corners=[
      [PLANE_X,-GRID_N*GRID_STEP,-GRID_N*GRID_STEP],
      [PLANE_X, GRID_N*GRID_STEP,-GRID_N*GRID_STEP],
      [PLANE_X, GRID_N*GRID_STEP, GRID_N*GRID_STEP],
      [PLANE_X,-GRID_N*GRID_STEP, GRID_N*GRID_STEP],
    ];
    ctx.save();
    ctx.strokeStyle=COLORS.B+'55'; ctx.lineWidth=1.2; ctx.setLineDash([4,4]);
    ctx.beginPath();
    corners.forEach((c,i)=>{
      const [cx,cy]=transform(c);
      i===0?ctx.moveTo(cx,cy):ctx.lineTo(cx,cy);
    });
    ctx.closePath(); ctx.stroke(); ctx.restore();

    // charge indicator badge (top-left of canvas)
    const bx2=18, by2=18, br=14;
    ctx.save();
    ctx.beginPath(); ctx.arc(bx2,by2,br,0,Math.PI*2);
    ctx.fillStyle = chargePos ? COLORS.B+'33' : COLORS.V+'33';
    ctx.strokeStyle = chargePos ? COLORS.B : COLORS.V;
    ctx.lineWidth=1.5; ctx.shadowColor = chargePos?COLORS.B:COLORS.V; ctx.shadowBlur=10;
    ctx.fill(); ctx.stroke();
    ctx.font=`900 ${br}px 'Orbitron',sans-serif`;
    ctx.fillStyle = chargePos?COLORS.B:COLORS.V;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(chargePos?'+':'−', bx2, by2+1);
    ctx.restore();
  }

  draw();
})();
</script>
</body>
</html>
